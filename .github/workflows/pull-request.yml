name: Process Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test Geyser Core
        run: ./gradlew :core:build --no-daemon --stacktrace
      - name: Build Geyser Spigot distribution
        run: ./gradlew :bootstrap:spigot:shadowJar --no-daemon --stacktrace

      - name: Retain test-only Geyser Spigot distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Geyser-Spigot-security-candidate
          path: bootstrap/spigot/build/libs/Geyser-Spigot.jar
          if-no-files-found: error
          retention-days: 7

      - name: Record resolved Netty and Aircompressor runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :core:dependencyInsight --dependency io.netty:netty-handler --configuration runtimeClasspath --no-daemon
          ./gradlew :core:dependencyInsight --dependency io.airlift:aircompressor --configuration runtimeClasspath --no-daemon
